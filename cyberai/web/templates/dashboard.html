<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberAI Dashboard</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { font-family: ui-monospace, "SF Mono", Menlo, monospace; background:#0d1117; color:#c9d1d9; margin:0; padding:24px; }
    h1 { font-size:18px; color:#58a6ff; margin:0 0 16px; }
    .bar { display:flex; gap:8px; align-items:center; margin-bottom:16px; }
    button { background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
    button:hover { border-color:#58a6ff; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:6px 10px; border-bottom:1px solid #21262d; }
    th { color:#8b949e; font-weight:normal; }
    tr.row { cursor:pointer; }
    tr.row:hover { background:#161b22; }
    .state { padding:1px 8px; border-radius:10px; font-size:11px; }
    .completed { background:#23863633; color:#3fb950; }
    .failed,.error { background:#da363333; color:#f85149; }
    .running,.pending { background:#9e6a0333; color:#d29922; }
    .panel { margin-top:20px; background:#161b22; border:1px solid #30363d; border-radius:6px; padding:16px; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:12px; color:#c9d1d9; }
    .muted { color:#8b949e; font-size:12px; }
    .live { color:#3fb950; font-size:12px; }
  </style>
</head>
<body x-data="dashboard()">
  <h1>🟩 CyberAI — Scan Sessions</h1>

  <div class="bar">
    <button @click="load()">↻ Refresh</button>
    <button @click="alert('Start scans via CLI: cyberai scan <target>')">+ New scan</button>
    <span class="muted" x-text="`${sessions.length} sessions`"></span>
  </div>

  <table>
    <thead>
      <tr><th>Session</th><th>Target</th><th>State</th><th>Findings</th><th>Created</th></tr>
    </thead>
    <tbody>
      <template x-for="s in sessions" :key="s.session_id">
        <tr class="row" @click="open(s)">
          <td x-text="s.session_id"></td>
          <td x-text="s.target"></td>
          <td><span class="state" :class="(s.state||'').toLowerCase()" x-text="s.state"></span></td>
          <td x-text="s.findings"></td>
          <td class="muted" x-text="(s.created_at||'').slice(0,19).replace('T',' ')"></td>
        </tr>
      </template>
      <tr x-show="sessions.length===0"><td colspan="5" class="muted">No sessions yet. Run: cyberai scan example.com --dry-run</td></tr>
    </tbody>
  </table>

  <div class="panel" x-show="selected" x-cloak>
    <div class="bar">
      <strong x-text="selected?.session_id"></strong>
      <span class="live" x-show="streaming" x-text="liveMsg"></span>
      <button @click="selected=null" style="margin-left:auto">✕ Close</button>
    </div>
    <div class="muted" x-text="`Phases seen: ${phases.join(' → ') || '—'}`"></div>
    <pre x-text="report"></pre>
  </div>

  <script>
    function dashboard() {
      return {
        sessions: [], selected: null, report: "", phases: [],
        streaming: false, liveMsg: "", _es: null,
        async load() {
          const r = await fetch("/api/sessions");
          this.sessions = (await r.json()).sessions;
        },
        async open(s) {
          this.selected = s; this.report = "loading…"; this.phases = [];
          const rr = await fetch(`/api/sessions/${s.session_id}/report`);
          this.report = rr.ok ? await rr.text() : "(no report — dry-run or not generated)";
          this.stream(s.session_id);
        },
        stream(id) {
          if (this._es) this._es.close();
          this.streaming = true; this.liveMsg = "● live";
          const es = new EventSource(`/api/sessions/${id}/stream`);
          this._es = es;
          es.addEventListener("phase", e => {
            const p = JSON.parse(e.data);
            if (p.phase && !this.phases.includes(p.phase)) this.phases.push(p.phase);
          });
          es.addEventListener("done", e => {
            this.liveMsg = `done (${JSON.parse(e.data).state})`;
            this.streaming = false; es.close();
          });
          es.onerror = () => { this.streaming = false; es.close(); };
        },
        init() { this.load(); }
      };
    }
  </script>
  <style>[x-cloak]{display:none}</style>
</body>
</html>

name: CyberAI CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # The coverage upload authenticates as this job rather than with a stored
    # secret, the way the release workflow already publishes to PyPI.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        # This project is developed on 3.14 and no job ran it: every green
        # check spoke about a version nobody uses. The matrix is the
        # instrument; requires-python, the classifiers and the README badge
        # are not widened until it reports.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Codecov reads the commit SHA out of git history and documents a
          # full fetch; at depth one a pull request's merge commit has no
          # parent here. This was also offered as the reason codecov/project
          # never arrived, and that part was wrong: the depth was raised in
          # day 32 and the next commit still had patch without project. It
          # stays because the documented requirement holds either way.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -m "not slow"

      - name: Run integration tests (excluding smoke)
        run: |
          pytest tests/integration/ -v --tb=short -m "not smoke and not slow"

      - name: Generate coverage report
        run: |
          pytest tests/ --cov=cyberai --cov-report=term-missing --cov-report=xml -m "not smoke and not slow"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true
          # Auto-detection files every report on branch main with no pull
          # request attached, so the project status has no base to compare
          # against and is never sent. Measured on bcc4282: patch arrived,
          # project did not, the commit was recorded on main and pull 266 had
          # head and compared_to null. These two values are the same facts
          # taken from the event payload instead of guessed from the checkout.
          override_pr: ${{ github.event.pull_request.number }}
          override_branch: ${{ github.head_ref || github.ref_name }}

  architecture:
    name: Architecture Invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run architecture tests
        run: |
          pytest tests/architecture/ -v --tb=short

  smoke:
    name: Smoke Tests (end-to-end)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run smoke tests
        run: |
          pytest tests/ -v --tb=short -m smoke

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.6.0,<1"
      - name: Run ruff linter
        run: ruff check cyberai/ tests/
      - name: Check formatting
        run: ruff format --check cyberai/ tests/

  typecheck:
    name: Type check (strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy --strict
        run: mypy
      - name: Report modules that pass strictly outside the declared scope
        run: python scripts/typing_scope_drift.py
      - name: Check the declared stubs are the stubs that ship
        run: python scripts/stub_distributions.py

  mcp-1x:
    name: MCP surface on mcp 1.x
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install at the lower bound the manifest promises
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "mcp>=1.0,<2"
      - name: Serve and probe on the 1.x SDK
        run: |
          python -c "import importlib.metadata as m; assert m.version('mcp').startswith('1.'), m.version('mcp'); print('mcp', m.version('mcp'))"
          pytest tests/unit/test_mcp.py tests/unit/test_mcp_sdk_compat.py tests/integration/test_mcp_scan.py tests/integration/test_mcp_stdio_roundtrip.py -v --tb=short

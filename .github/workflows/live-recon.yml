name: Live Recon (scanme.nmap.org)

# Legal: scanme.nmap.org is explicitly authorized by its operator (the Nmap
# project) for scan testing. This job runs RECON ONLY (ports / service banners),
# rate-limited, and never performs exploitation. No secrets are used — the recon
# phase needs no LLM/API key.

on:
  schedule:
    - cron: "0 3 * * *"   # nightly, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  live-recon:
    name: Recon-only scan of scanme.nmap.org
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Install CyberAI
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Recon-only scan (rate-limited, no exploitation)
        run: |
          cyberai scan scanme.nmap.org --recon-only --max-rps 50 | tee recon-output.txt

      - name: Upload recon report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-report
          path: |
            reports/
            recon-output.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish live-run badge
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then MSG="passing"; COLOR="brightgreen"; else MSG="failing"; COLOR="red"; fi
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p badge-out && cd badge-out
          printf '{"schemaVersion":1,"label":"live recon","message":"%s \u00b7 %s","color":"%s"}\n' "$MSG" "$DATE" "$COLOR" > latest.json
          git init -q
          git checkout -qb badges
          git add latest.json
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "chore(badge): live-recon $MSG $DATE [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:badges

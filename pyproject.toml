[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberai"
dynamic = ["version"]
description = "CyberAI — AI-native multi-agent pentest platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "evkir" },
]
keywords = ["pentest", "security", "ai", "multi-agent", "offensive-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "openai>=2.0,<3",
    "anthropic>=0.28.0,<1",
    "mcp>=1.0,<3",
    "click>=8.1.7,<9",
    "rich>=13.7.0,<14",
    "pydantic>=2.7.0,<3",
    "python-dotenv>=1.0.0,<2",
    "httpx>=0.27.0,<1",
    "python-whois>=0.9.4,<1",
    "dnspython>=2.6.1,<3",
    "cryptography>=42,<47",
    "networkx>=3.2.1,<4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "anyio>=4,<5",
]
dev = [
    "ruff>=0.6.0,<1",
    "mypy>=1.19.1,<2",
    "types-PyYAML>=6,<7",
]

[project.scripts]
cyberai = "cyberai.__main__:cli"

[project.urls]
Homepage = "https://github.com/evkir/CyberAI"
Repository = "https://github.com/evkir/CyberAI"
Issues = "https://github.com/evkir/CyberAI/issues"

[tool.hatch.version]
path = "cyberai/version.py"

[tool.hatch.build.targets.wheel]
packages = ["cyberai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
